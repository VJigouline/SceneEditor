<mat-card class="shipping-card">
    <mat-card-content>
        <div class="row">
            <mat-slide-toggle [checked]="raytrace.enabled" (change)="onEnabledChange($event)">Ray traced view</mat-slide-toggle>
        </div>
        <div class="row">
            <div class="col">
                <mat-form-field class="full-width">
                    <mat-label>Samples per pixel</mat-label>
                    <mat-select [value]="raytrace.samples" (selectionChange)="onSamplesChange($event)">
                        <mat-option *ngFor="let option of sampleOptions" [value]="option">{{option}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <mat-checkbox [checked]="raytrace.shadows" (change)="onShadowsChange($event)">Shadows</mat-checkbox>
        </div>
        <div class="row">
            <mat-checkbox [checked]="raytrace.globalIllumination" (change)="onGlobalIlluminationChange($event)"
                matTooltip="Light also bounces off diffuse surfaces. Slower to clear up.">Global illumination</mat-checkbox>
        </div>
        <div class="row progress" *ngIf="raytrace.enabled && (raytrace.progress | async) as progress">
            <span>{{ progress.done ? 'Done' : 'Tracing' }}: {{ progress.samples }} of {{ progress.maxSamples }} samples</span>
            <mat-progress-bar mode="determinate"
                [value]="progress.maxSamples ? 100 * progress.samples / progress.maxSamples : 0"></mat-progress-bar>
        </div>
    </mat-card-content>
    <mat-card-actions>
        <button mat-raised-button color="primary" [disabled]="!raytrace.enabled" (click)="onSave()">Save image</button>
    </mat-card-actions>
</mat-card>
